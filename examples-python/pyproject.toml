[project]
name = "klswitch-examples-python"
version = "0.0.0"
description = "Demo servers showcasing klswitch-sdk's Flask and FastAPI adapters"
requires-python = ">=3.10"
# The SDK is installed from ../sdk-python (editable) by the setup commands in
# the README. We list runtime deps here so the example is self-describing.
dependencies = [
    "klswitch-sdk[flask,fastapi]",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
